# PPO / rl_games training config template.
# This is used by sapg/train.py and can be extended.

params:
  seed: 0
  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: false

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: fixed

    mlp:
      units: [512, 256, 128]
      activation: elu
      d2rl: false
      initializer:
        name: default
      regularizer:
        name: None

    # For mixed obs with depth, use:
    # depth_encoder:
    #   type: cnn
    #   output_dim: 128

  config:
    name: 00_DexManip
    full_experiment_name: 00_DexManip
    env_name: rlgpu
    multi_gpu: false
    ppo: true
    mixed_precision: true
    normalize_input: true
    normalize_value: true
    value_bootstrap: true
    num_actors: 8192
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: true
    gamma: 0.998
    tau: 0.95
    learning_rate: 5e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.016
    score_to_win: 100000
    max_epochs: 100000
    save_best_after: 200
    save_frequency: 200
    print_stats: true
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: true
    e_clip: 0.2
    horizon_length: 8
    minibatch_size: 32768
    mini_epochs: 5
    critic_coef: 4
    clip_value: true
    seq_length: 4
    bounds_loss_coef: 0.0001

    # SAPG-specific parameters (required by the SAPG rl_games fork)
    expl_type: none
    use_others_experience: none
    off_policy_ratio: 0
    good_reset_boundary: 0
