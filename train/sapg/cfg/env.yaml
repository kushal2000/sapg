# Task-level config — simulator-agnostic.
# This configures the DexManipEnv task logic (obs lists, rewards, etc.)
# Simulator-specific params go in sapg/cfg/sim/{isaacgym,mujoco,mochi}.yaml

env:
  numEnvs: 8192
  episodeLength: 600
  controlFrequencyInv: 1

  # Observation lists — what the actor and critic see
  stateList:
    - joint_pos
    - joint_vel
    - prev_action_targets
    - palm_pos
    - palm_rot
    - palm_vel
    - object_rot
    - object_vel
    - fingertip_pos_rel_palm
    - keypoints_rel_palm
    - keypoints_rel_goal
    - object_scales
    - closest_keypoint_max_dist
    - closest_fingertip_dist
    - lifted_object
    - progress
    - successes
    - reward

  obsList:
    - joint_pos
    - joint_vel
    - prev_action_targets
    - palm_pos
    - palm_rot
    - object_rot
    - fingertip_pos_rel_palm
    - keypoints_rel_palm
    - keypoints_rel_goal
    - object_scales
    # To add depth: uncomment the line below
    # - depth_image

  # Depth observation settings
  useDepthObservation: false
  depthImageSize: 224
  depthCameraMount: fixed  # "fixed" or "wrist"
  depthCameraPos: [0.5, 0.0, 0.8]
  depthCameraTarget: [0.0, 0.0, 0.5]
  depthCameraWristBody: iiwa14_link_7

  # Reward scales
  distanceDeltaRewScale: 50.0
  liftingRewScale: 20.0
  liftingBonus: 300.0
  liftingBonusThreshold: 0.15
  keypointRewScale: 200.0
  reachGoalBonus: 1000.0
  kukaActionsPenaltyScale: 0.003
  allegroActionsPenaltyScale: 0.0003
  objectLinVelPenaltyScale: 0.0
  objectAngVelPenaltyScale: 0.0
  fallDistance: 0.24
  fallPenalty: 0.0

  # Actions
  privilegedActions: false
  privilegedActionsTorque: 0.02
  useRelativeControl: false

  # Observations
  clampAbsObservations: 10.0
  clipObservations: 10.0
  clipActions: 1.0
  observationType: full_state

  # Object
  objectType: block
  objectBaseSize: 0.05
  keypointScale: 1.5
  randomizeObjectDimensions: true

  # Success
  successTolerance: 0.075
  targetSuccessTolerance: 0.01
  toleranceCurriculumIncrement: 0.9
  toleranceCurriculumInterval: 3000
  maxConsecutiveSuccesses: 50
  successSteps: 1

  # Reset
  resetPositionNoiseX: 0.1
  resetPositionNoiseY: 0.1
  resetPositionNoiseZ: 0.02
  randomizeObjectRotation: true
  resetDofPosRandomIntervalFingers: 0.1
  resetDofPosRandomIntervalArm: 0.1
  resetDofVelRandomInterval: 0.5

  # Delays and noise (sim2real)
  useObsDelay: false
  obsDelayMax: 3
  useActionDelay: false
  actionDelayMax: 3
  useObjectStateDelayNoise: false
  objectStateDelayMax: 10
  objectStateXyzNoiseStd: 0.01
  objectStateRotationNoiseDegrees: 5.0
  jointVelocityObsNoiseStd: 0.0

  # Asset
  asset:
    kukaAllegro: urdf/kuka_allegro_description/iiwa14_left_sharpa_adjusted_restricted.urdf
    table: urdf/table_narrow.urdf
